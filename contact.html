<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactformulier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 10px;
            margin: 0;
            overflow: hidden; /* Locks out scrollbars completely */
        }
        .contact-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-sizing: border-box;
        }
        h2 {
            color: #0b1c3d;
            margin: 0 0 15px 0;
            font-size: 20px;
        }
        .form-step {
            display: none;
        }
        .form-step.active {
            display: block;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
            color: #0b1c3d;
            font-size: 14px;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e6923b;
            border-radius: 0;
            box-sizing: border-box;
            background-color: #fcfcfc;
            font-size: 14px;
        }
        textarea {
            resize: none;
            height: 70px;
        }
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            background-color: #0b1c3d;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            flex: 1;
        }
        button:hover {
            background-color: #08132b;
        }
        .btn-secondary {
            background-color: #ccc;
            color: #333;
        }
        #result {
            margin-top: 10px;
            font-weight: bold;
            color: #0b1c3d;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="contact-container">
    <h2>CONTACT</h2>
    <form id="form" method="POST">
        <input type="hidden" name="access_key" value="63e1a15e-f252-4b03-9204-9718a738f7dc">
        
        <!-- STEP 1 -->
        <div class="form-step active" id="step-1">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <button type="button" onclick="nextStep()">Next &rarr;</button>
        </div>

        <!-- STEP 2 -->
        <div class="form-step" id="step-2">
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required></textarea>
            </div>

            <div class="btn-container">
                <button type="button" class="btn-secondary" onclick="prevStep()">&larr; Back</button>
                <button type="submit" id="submit-btn">Send</button>
            </div>
        </div>

        <div id="result"></div>
    </form>
</div>

<script>
    function nextStep() {
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        if(!name || !email) {
            alert('Please fill in Name and Email first.');
            return;
        }
        document.getElementById('step-1').classList.remove('active');
        document.getElementById('step-2').classList.add('active');
    }

    function prevStep() {
        document.getElementById('step-2').classList.remove('active');
        document.getElementById('step-1').classList.add('active');
    }

    const form = document.getElementById('form');
    const result = document.getElementById('result');

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(form);
        const object = Object.fromEntries(formData);
        const json = JSON.stringify(object);
        
        result.innerHTML = "Sending...";

        fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let json = await response.json();
                if (response.status == 200) {
                    result.innerHTML = "THANK YOU! Message sent.";
                    form.reset();
                } else {
                    result.innerHTML = json.message;
                }
            })
            .catch(error => {
                result.innerHTML = "Something went wrong!";
            });
    });
</script>

</body>
</html>
