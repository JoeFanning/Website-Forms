<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Buildbouw</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 35px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            border-top: 5px solid #e6923b;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: #0b1c3d;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .header p {
            color: #666;
            font-size: 14px;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: #0b1c3d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label span {
            color: #e6923b;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            color: #0b1c3d;
            background-color: #fafafa;
            border: 2px solid #e2e8f0;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            border-color: #e6923b;
            background-color: #ffffff;
        }

        textarea {
            resize: vertical;
            min-height: 110px;
        }

        button[type="submit"] {
            width: 100%;
            background-color: #0b1c3d;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            border-bottom: 3px solid #e6923b;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 5px;
        }

        button[type="submit"]:hover {
            background-color: #08132b;
        }

        button[type="submit"]:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        #result.success {
            display: block;
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #ceead6;
        }

        #result.error {
            display: block;
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
        }

        @media (max-width: 480px) {
            .contact-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <div class="header">
            <h2>Contact Us</h2>
            <p>Send a message and our team will get back to you shortly.</p>
        </div>

        <form id="form" method="POST">
            <!-- Web3Forms Access Key -->
            <input type="hidden" name="access_key" value="63e1a15e-f252-4b03-9204-9718a738f7dc">

            <div class="form-group">
                <label for="name">Full Name <span>*</span></label>
                <input type="text" id="name" name="name" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address <span>*</span></label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+31 6 12345678">
            </div>

            <div class="form-group">
                <label for="message">Message <span>*</span></label>
                <textarea id="message" name="message" placeholder="How can we help you?" required></textarea>
            </div>

            <button type="submit" id="submit-btn">Send Message</button>
            <div id="result"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('form');
        const result = document.getElementById('result');
        const submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Set loading state
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending...";
            result.className = "";
            result.style.display = "none";

            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let jsonRes = await response.json();
                if (response.status === 200) {
                    result.innerText = "Thank you! Your message has been sent. We will get back to you as soon as possible.";
                    result.className = "success";
                    form.reset();
                } else {
                    result.innerText = jsonRes.message || "Something went wrong! Please try again.";
                    result.className = "error";
                }
            })
            .catch(error => {
                console.error(error);
                result.innerText = "Something went wrong! Please try again.";
                result.className = "error";
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Message";
            });
        });
    </script>

</body>
</html>
